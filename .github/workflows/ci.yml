name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma validate

      - run: npm run lint

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/kotoxata"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/kotoxata"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "example-anon-key"
